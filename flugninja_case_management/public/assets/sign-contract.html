<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlugNinja Vertrag</title>
  <meta http-equiv="refresh" content="0;url=/contract-details">
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (token) {
        window.location.replace(`/contract-details?token=${encodeURIComponent(token)}`);
        return;
      }
      window.location.replace('/contract-details');
    })();
  </script>
</head>
<body>
  <p>Weiterleitung zu deinem FlugNinja-Vertrag...</p>
</body>
</html>
